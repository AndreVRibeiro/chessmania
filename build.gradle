plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.8'
    id 'jacoco'
}

javafx {
    version = "11.0.2"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.base', 'javafx.media']
}

jar {
    archiveBaseName = 'ChessMania'
    archiveVersion =  '0.1.0'
    manifest {
        attributes 'Main-Class': 'Main'
    }
}

group 'ChessMania'
version '0.0.1-ALPHA'
mainClassName = 'Main'
compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

//specifies source compatibility to Java 11
sourceCompatibility = 1.11

//adds maven central as a maven repository
repositories {
    mavenCentral()
    jcenter()
}


dependencies {

    implementation 'org.apache.logging.log4j:log4j-api:2.+'
    implementation 'org.apache.logging.log4j:log4j-core:2.+'

    implementation 'org.openjfx:javafx-controls:11.0.2'
    implementation 'org.jetbrains:annotations:20.1.0'

    testImplementation 'junit:junit:4.+'
    implementation 'org.junit.jupiter:junit-jupiter:5.4.2'

    compile 'io.github.typhon0:AnimateFX:1.2.2'
}

/*
The following block adds both compile and runtime dependencies to the jar
 */
jar {
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
    from {
        configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile){
            options.compilerArgs << "-Xlint:deprecation"
        }
    }

}



task "build-cs108" {
    dependsOn build
    dependsOn jar
    dependsOn javadoc
}
